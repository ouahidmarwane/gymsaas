# supabase/config.toml
[api]
enabled = true
port = 54321

[db]
port = 54322

[functions.send-reminders]
verify_jwt = false   # We verify the service role key manually

# ⚠️ CRON DÉSACTIVÉ VOLONTAIREMENT.
# Le moteur d'alertes quotidien est la fonction SQL generate_notifications()
# (cron pg_cron "daily-notifications" 08:00). Réactiver ce cron ici créerait
# un SECOND générateur qui écrit dans `notifications` en parallèle → doublons
# et suppressions non déterministes. Ne PAS le réactiver sans retirer d'abord
# la création de notifications de generate_notifications().
# [functions.send-reminders.cron]
# schedule = "0 7 * * *"   # 08:00 Morocco time (UTC+1)
