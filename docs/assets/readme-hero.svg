<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">GymFlow — la gestion de club en mouvement</title>
  <desc id="desc">Bannière sombre animée présentant GymFlow, sa gestion multi-clubs et son architecture Cloudflare.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="0.52" stop-color="#0b1420"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#facc15"/>
      <animate attributeName="x1" values="0;0.35;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0.65;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="80" cy="300" r="210" fill="url(#glow)" filter="url(#soft)">
    <animate attributeName="cx" values="80;300;80" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="35" r="190" fill="url(#glow)" filter="url(#soft)" opacity="0.75">
    <animate attributeName="cy" values="35;150;35" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(70 67)">
    <rect width="58" height="58" rx="17" fill="url(#accent)"/>
    <path d="M15 21h7v16h-7zm21 0h7v16h-7zM22 26h14v6H22zM10 25h5v8h-5zm33 0h5v8h-5z" fill="#111827"/>
    <text x="76" y="45" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="-1.5">GymFlow</text>
  </g>

  <text x="70" y="183" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Votre club. Vos données. Votre rythme.</text>
  <text x="70" y="219" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Plateforme SaaS multi-clubs • isolation physique • expérience tout-en-un</text>

  <g transform="translate(70 265)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650">
    <g><rect width="135" height="36" rx="18" fill="#17212e" stroke="#334155"/><circle cx="20" cy="18" r="5" fill="#22c55e"><animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></circle><text x="34" y="23" fill="#dbeafe">Multi-tenant</text></g>
    <g transform="translate(150)"><rect width="150" height="36" rx="18" fill="#17212e" stroke="#334155"/><circle cx="20" cy="18" r="5" fill="#38bdf8"><animate attributeName="opacity" values=".35;1;.35" dur="2.2s" repeatCount="indefinite"/></circle><text x="34" y="23" fill="#dbeafe">Cloudflare Edge</text></g>
    <g transform="translate(315)"><rect width="145" height="36" rx="18" fill="#17212e" stroke="#334155"/><circle cx="20" cy="18" r="5" fill="#f59e0b"><animate attributeName="opacity" values="1;.4;1" dur="2.5s" repeatCount="indefinite"/></circle><text x="34" y="23" fill="#dbeafe">Secure by design</text></g>
  </g>

  <g transform="translate(765 55)" filter="url(#shadow)">
    <rect width="365" height="250" rx="24" fill="#111a26" stroke="#334155"/>
    <rect x="22" y="20" width="321" height="43" rx="12" fill="#172333"/>
    <circle cx="44" cy="41.5" r="7" fill="#f59e0b"/>
    <rect x="61" y="34" width="112" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="61" y="48" width="72" height="5" rx="2.5" fill="#64748b"/>
    <g transform="translate(22 82)">
      <rect width="96" height="71" rx="14" fill="#162131"/>
      <text x="14" y="25" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">MEMBRES</text>
      <text x="14" y="53" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="750">1 248</text>
      <rect x="112" width="96" height="71" rx="14" fill="#162131"/>
      <text x="126" y="25" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">ACTIFS</text>
      <text x="126" y="53" fill="#4ade80" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="750">92%</text>
      <rect x="224" width="99" height="71" rx="14" fill="#162131"/>
      <text x="238" y="25" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">SALLES</text>
      <text x="238" y="53" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="750">12</text>
    </g>
    <g transform="translate(22 174)">
      <path d="M0 43 C35 40,38 24,72 29 S121 48,154 29 S205 8,240 20 S287 17,321 2" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="390" stroke-dashoffset="390">
        <animate attributeName="stroke-dashoffset" values="390;0;0" keyTimes="0;.65;1" dur="4.5s" repeatCount="indefinite"/>
      </path>
      <path d="M0 43 C35 40,38 24,72 29 S121 48,154 29 S205 8,240 20 S287 17,321 2 V54 H0Z" fill="url(#glow)" opacity="0.45"/>
      <line x1="0" y1="54" x2="321" y2="54" stroke="#334155"/>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#f59e0b" stroke-opacity="0.2"/>
</svg>
